[project]
name = "espelho"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rafhael Corsini", email = "rafhaelcorsini@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.16.2",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.64.0",
]

[project.scripts]
espelho = "espelho:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
]
